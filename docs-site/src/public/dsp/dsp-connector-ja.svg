<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif" role="img" aria-label="利用者 | 2 つのポータル（入口） | DSP の提供者">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#475569"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ags" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#15803d"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker><marker id="ais" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#4f46e5"/></marker></defs>
<rect width="1200" height="860" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="70" width="250" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="145.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">利用者</text>
<rect x="300" y="70" width="530" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="565.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">2 つのポータル（入口）</text>
<rect x="860" y="70" width="320" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="1020.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">DSP の提供者</text>
<rect x="40" y="160" width="160" height="220" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="120" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">利用者</text>
<text x="120" y="284" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">研究者・学生</text>
<rect x="40" y="600" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="140" y="632" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">提供者の担当者</text>
<text x="140" y="654" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">自分のファイルを確認</text>
<rect x="330" y="120" width="470" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="565" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">ds.ldas.jp</text>
<text x="565" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">DSP の提供者のカタログ、</text>
<text x="565" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">契約、円での支払い（pay.ldas.jp）</text>
<text x="565" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">ログイン: LDAS ID（VC）、財布不要</text>
<rect x="330" y="300" width="220" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="440" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">cliox.ldas.jp</text>
<text x="440" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">Clio-X ポータル（Ocean）</text>
<text x="440" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">購入・計算の開始</text>
<text x="440" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">財布が要る</text>
<rect x="610" y="300" width="190" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="705" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Clio-X の運営者</text>
<text x="705" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">ノードのための利用者側</text>
<text x="705" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">計算だけ、</text>
<text x="705" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">再配布はしない</text>
<rect x="330" y="500" width="300" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="480" y="530" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Ocean ノード</text>
<text x="480" y="552" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">DSP なし・データは持たない</text>
<text x="480" y="574" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">取得 → 隔離して実行</text>
<text x="480" y="596" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">→ 結果だけを返す</text>
<rect x="880" y="120" width="280" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1020" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">news-a、yanesen</text>
<text x="1020" y="176" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">ldas-dsp の提供者ノード</text>
<text x="1020" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">制御とデータの面が一体</text>
<rect x="872" y="270" width="296" height="350" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1020" y="294" text-anchor="middle" font-size="16" font-weight="600" fill="#5b21b6">Clio-X のデータの提供者</text>
<rect x="890" y="310" width="260" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1020" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">制御の面（計画中）</text>
<text x="1020" y="358" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">cliox-dsp.ldas.jp、ldas-dsp</text>
<text x="1020" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">カタログ・ODRL・契約</text>
<rect x="890" y="470" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="1020" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">データの面（稼働中）</text>
<text x="1020" y="522" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">cliox-files.ldas.jp</text>
<text x="1020" y="546" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">Cloudflare Access が守る</text>
<text x="1020" y="570" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">交渉はしない</text>
<path d="M202 200 H328" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="208" y="220" text-anchor="start" font-size="11" font-weight="400" fill="#475569">カタログを見る・契約・</text>
<text x="208" y="234" text-anchor="start" font-size="11" font-weight="400" fill="#475569">閲覧 / ダウンロード</text>
<path d="M202 340 H328" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="208" y="360" text-anchor="start" font-size="11" font-weight="400" fill="#475569">購入・</text>
<text x="208" y="374" text-anchor="start" font-size="11" font-weight="400" fill="#475569">計算の開始</text>
<path d="M802 160 H878" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="840" y="138" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">DSP、依頼の</text>
<text x="840" y="151" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">たびに</text>
<path d="M802 215 H840 V330 H888" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="846" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4f46e5">DSP</text>
<path d="M802 380 H888" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="836" y="400" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">1 回だけ</text>
<text x="836" y="414" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">DSP で契約</text>
<path d="M608 360 H552" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="580" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">認証情報</text>
<text x="580" y="351" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">→ DDO</text>
<path d="M420 422 V498" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="430" y="452" text-anchor="start" font-size="11" font-weight="400" fill="#475569">DDO: URL とヘッダー</text>
<text x="430" y="466" text-anchor="start" font-size="11" font-weight="400" fill="#475569">（暗号化）</text>
<path d="M888 540 H632" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="760" y="568" text-anchor="middle" font-size="11" font-weight="400" fill="#c2410c">ファイル、ジョブごと</text>
<text x="760" y="582" text-anchor="middle" font-size="11" font-weight="400" fill="#c2410c">（Access のサービストークン）</text>
<path d="M328 580 H120 V382" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#ag)"/>
<text x="220" y="572" text-anchor="middle" font-size="12" font-weight="400" fill="#15803d">結果だけ</text>
<path d="M60 158 V48 H1120 V118" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="140" y="40" text-anchor="start" font-size="12" font-weight="400" fill="#c2410c">(1) 提供者から直接データ: DSP のデータの受け渡し。ds.ldas.jp で契約した後の短期の通行証（news-a は 20 分）</text>
<path d="M242 660 H300 V710 H1020 V602" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="2 4"/>
<text x="320" y="700" text-anchor="start" font-size="12" font-weight="400" fill="#475569">(2) Cloudflare Access のメールでのログイン: 提供者自身の担当者だけ（管理用。利用者の道ではない）</text>
<line x1="40" y1="770" x2="76" y2="770" stroke="#c2410c" stroke-width="5"/>
<text x="84" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">ファイルのデータ</text>
<line x1="228" y1="770" x2="264" y2="770" stroke="#15803d" stroke-width="5"/>
<text x="272" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">結果だけ</text>
<line x1="364" y1="770" x2="400" y2="770" stroke="#4f46e5" stroke-width="3"/>
<text x="408" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">DSP</text>
<line x1="487" y1="770" x2="523" y2="770" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="531" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">依頼・メタデータ</text>
<line x1="675" y1="770" x2="711" y2="770" stroke="#475569" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="719" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">Access のログイン（担当者）</text>
<text x="40" y="816" text-anchor="start" font-size="12" font-weight="400" fill="#475569">ds.ldas.jp は依頼のたびに DSP で提供者とやり取りする。cliox.ldas.jp は DSP を話さず、Ocean ノードがジョブごとにデータの面から取得する。DSP はノードの契約で 1 回だけ。</text>
</svg>