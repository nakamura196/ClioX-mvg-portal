<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif" role="img" aria-label="Ocean ノード">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="600" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="40" width="300" height="130" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
<text x="190" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2430">DSP コネクタ</text>
<text x="190" y="98" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">カタログ・ODRL ポリシー・</text>
<text x="190" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">契約・転送の開始</text>
<text x="190" y="138" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">（ds.ldas.jp、Eclipse EDC など）</text>
<rect x="40" y="300" width="300" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="190" y="338" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2430">提供者の保管場所</text>
<text x="190" y="358" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">非公開</text>
<text x="190" y="378" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">例: cliox-files.ldas.jp</text>
<text x="190" y="398" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">（Cloudflare Access の内側）</text>
<rect x="480" y="40" width="240" height="110" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
<text x="600" y="78" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2430">Clio-X ポータル</text>
<text x="600" y="98" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">登録 / 購入</text>
<text x="600" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">（cliox.ldas.jp）</text>
<rect x="450" y="260" width="300" height="190" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
<text x="600" y="296" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2430">Ocean ノード</text>
<text x="600" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">データセットは持たない</text>
<text x="600" y="344" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">1. ジョブごとにファイルを取得</text>
<text x="600" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">2. 隔離したコンテナで実行</text>
<text x="600" y="392" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">（ネットワークなし）</text>
<text x="600" y="416" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">3. 結果だけを返す</text>
<rect x="860" y="300" width="300" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
<text x="1010" y="340" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2430">利用者</text>
<text x="1010" y="360" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">受け取るのは結果だけ</text>
<text x="1010" y="380" text-anchor="middle" font-size="15" font-weight="400" fill="#1b2430">ファイルは渡らない</text>
<path d="M340 95 H478" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="410" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">データの場所</text>
<text x="410" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2430">+ 認証情報</text>
<text x="410" y="88" text-anchor="middle" font-size="12" font-weight="400" fill="#1b2430">（メタデータだけ）</text>
<path d="M190 170 V298" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="200" y="238" text-anchor="start" font-size="15" font-weight="600" fill="#475569">アクセスを守る</text>
<path d="M600 150 V258" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="612" y="196" text-anchor="start" font-size="15" font-weight="600" fill="#475569">DDO: ファイルの URL と</text>
<text x="612" y="214" text-anchor="start" font-size="13" font-weight="400" fill="#475569">ヘッダー（暗号化）</text>
<path d="M340 365 H448" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)" />
<text x="394" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430"></text>
<path d="M750 355 H858" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#ag)" />
<text x="804" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">結果だけ</text>
<path d="M1010 298 V95 H722" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="1020" y="200" text-anchor="start" font-size="15" font-weight="600" fill="#475569">購入・ジョブ開始</text>
<text x="395" y="500" text-anchor="middle" font-size="15" font-weight="600" fill="#c2410c">ファイル（ジョブごとに 1 回）</text>
<text x="395" y="520" text-anchor="middle" font-size="13" font-weight="400" fill="#c2410c">（DDO の URL とヘッダーで取得）</text>
<path d="M395 480 V372" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
<line x1="40" y1="548" x2="80" y2="548" stroke="#c2410c" stroke-width="5"/>
<text x="90" y="553" text-anchor="start" font-size="15" font-weight="600" fill="#1b2430">ファイルのデータ（保管場所とノードの間だけ）</text>
<line x1="470" y1="548" x2="510" y2="548" stroke="#15803d" stroke-width="5"/>
<text x="520" y="553" text-anchor="start" font-size="15" font-weight="600" fill="#1b2430">結果だけ</text>
<line x1="640" y1="548" x2="680" y2="548" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="690" y="553" text-anchor="start" font-size="15" font-weight="600" fill="#1b2430">メタデータ・認証情報・依頼（ファイルなし）</text>
<text x="40" y="583" text-anchor="start" font-size="14" font-weight="600" fill="#475569">Ocean は URL とヘッダーで取得するだけ。DSP を話すのは私たちの設計で、Ocean の機能ではない。</text>
</svg>