<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif" role="img" aria-label="最初に 1 回: 契約（DSP） / 計算ジョブごと（Ocean、DSP なし）">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="780" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="16" width="1160" height="270" rx="10" fill="#f1f5ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="2 0"/>
<text x="36" y="40" text-anchor="start" font-size="15" font-weight="600" fill="#334155">最初に 1 回: 契約（DSP）</text>
<rect x="20" y="304" width="1160" height="400" rx="10" fill="#f4faf5" stroke="#86efac" stroke-width="1.5" stroke-dasharray="2 0"/>
<text x="36" y="328" text-anchor="start" font-size="15" font-weight="600" fill="#334155">計算ジョブごと（Ocean、DSP なし）</text>
<rect x="40" y="56" width="380" height="170" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
<text x="230" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">DSP の提供者</text>
<text x="230" y="110" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">DSP を話す</text>
<text x="230" y="134" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">news-a、yanesen（ldas-dsp）</text>
<text x="230" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">Eclipse EDC</text>
<text x="230" y="182" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">Clio-X のデータの提供者（計画中）</text>
<rect x="500" y="176" width="200" height="70" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
<text x="600" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">ds.ldas.jp</text>
<text x="600" y="224" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">ポータル（コネクタではない）</text>
<rect x="780" y="56" width="340" height="130" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
<text x="950" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Clio-X の運営者</text>
<text x="950" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">ノードのための利用者側</text>
<text x="950" y="130" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">合意: 計算だけ、</text>
<text x="950" y="152" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">再配布はしない</text>
<path d="M422 120 H778" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="600" y="100" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">DSP: カタログ・ODRL ポリシー・</text>
<text x="600" y="117" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">契約の交渉・転送</text>
<path d="M498 211 H422" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="460" y="181" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">カタログを</text>
<text x="460" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">集める</text>
<path d="M950 186 V294 H480 V348" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="715" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">長期の認証情報を DDO に入れる</text>
<rect x="40" y="346" width="200" height="84" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
<text x="140" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">公開する人</text>
<text x="140" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">データの持ち主</text>
<rect x="360" y="348" width="280" height="90" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
<text x="500" y="376" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Clio-X ポータル</text>
<text x="500" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">cliox.ldas.jp</text>
<text x="500" y="416" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">公開 / 購入</text>
<path d="M242 400 H358" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="300" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">データセットを</text>
<text x="300" y="387" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">登録</text>
<rect x="40" y="530" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="170" y="562" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">データの保管場所</text>
<text x="170" y="584" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">DSP は話さない</text>
<text x="170" y="606" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">cliox-files.ldas.jp</text>
<text x="170" y="628" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">Cloudflare Access が守る</text>
<rect x="400" y="510" width="320" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
<text x="560" y="540" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Ocean ノード</text>
<text x="560" y="562" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">DSP なし・データは持たない</text>
<text x="560" y="584" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">1. URL とヘッダーで取得</text>
<text x="560" y="606" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">2. 隔離したコンテナで実行</text>
<text x="560" y="628" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">（ネットワークなし）</text>
<text x="560" y="650" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">3. 結果だけを返す</text>
<rect x="880" y="540" width="280" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
<text x="1020" y="576" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">利用者</text>
<text x="1020" y="598" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">受け取るのは結果だけ</text>
<text x="1020" y="620" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">ファイルは渡らない</text>
<path d="M560 438 V508" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="572" y="468" text-anchor="start" font-size="12" font-weight="400" fill="#475569">DDO: URL とヘッダー</text>
<text x="572" y="484" text-anchor="start" font-size="12" font-weight="400" fill="#475569">（暗号化）</text>
<path d="M300 595 H398" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="349" y="625" text-anchor="middle" font-size="12" font-weight="400" fill="#c2410c">ファイル</text>
<text x="349" y="640" text-anchor="middle" font-size="12" font-weight="400" fill="#c2410c">（ジョブごと）</text>
<path d="M720 595 H878" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#ag)"/>
<text x="799" y="580" text-anchor="middle" font-size="13" font-weight="400" fill="#15803d">結果だけ</text>
<path d="M1020 538 V400 H642" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="1030" y="470" text-anchor="start" font-size="13" font-weight="400" fill="#475569">購入・ジョブ開始</text>
<line x1="40" y1="730" x2="80" y2="730" stroke="#c2410c" stroke-width="5"/>
<text x="90" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">ファイルのデータ（保管場所からノードだけ）</text>
<line x1="440" y1="730" x2="480" y2="730" stroke="#15803d" stroke-width="5"/>
<text x="490" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">結果だけ</text>
<line x1="600" y1="730" x2="640" y2="730" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="650" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">メタデータ・認証情報・依頼（ファイルなし）</text>
<text x="40" y="760" text-anchor="start" font-size="12" font-weight="400" fill="#475569">Ocean は URL とヘッダーで取得するだけ。DSP は最初の契約でだけ使う。ds.ldas.jp と ldas-dsp は DSP を実装している。</text>
</svg>