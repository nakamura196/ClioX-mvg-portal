<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Users | Two portals (entry points) | DSP providers">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#475569"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="ags" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#15803d"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker><marker id="ais" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M10 0L0 5L10 10z" fill="#4f46e5"/></marker></defs>
<rect width="1200" height="860" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="70" width="250" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="145.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Users</text>
<rect x="300" y="70" width="530" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="565.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Two portals (entry points)</text>
<rect x="860" y="70" width="320" height="660" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="1020.0" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">DSP providers</text>
<rect x="40" y="160" width="160" height="220" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="120" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Consumer</text>
<text x="120" y="284" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">researcher, student</text>
<rect x="40" y="600" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="140" y="632" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Provider's staff</text>
<text x="140" y="654" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">checks own files</text>
<rect x="330" y="120" width="470" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="565" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">ds.ldas.jp</text>
<text x="565" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">catalog of the DSP providers,</text>
<text x="565" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">contract, yen payment (pay.ldas.jp)</text>
<text x="565" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">login: LDAS ID (VC), no wallet</text>
<rect x="330" y="300" width="220" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="440" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">cliox.ldas.jp</text>
<text x="440" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">Clio-X portal (Ocean)</text>
<text x="440" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">buy, start compute</text>
<text x="440" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">needs a wallet</text>
<rect x="610" y="300" width="190" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="705" y="328" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Clio-X operator</text>
<text x="705" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">consumer side for the node</text>
<text x="705" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">compute only,</text>
<text x="705" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">no redistribution</text>
<rect x="330" y="500" width="300" height="120" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="480" y="530" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Ocean node</text>
<text x="480" y="552" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">no DSP, holds no dataset</text>
<text x="480" y="574" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">fetch → run isolated</text>
<text x="480" y="596" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">→ return results only</text>
<rect x="880" y="120" width="280" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1020" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">news-a, yanesen</text>
<text x="1020" y="176" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">ldas-dsp provider nodes</text>
<text x="1020" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">control + data plane in one</text>
<rect x="872" y="270" width="296" height="350" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1020" y="294" text-anchor="middle" font-size="16" font-weight="600" fill="#5b21b6">Clio-X data provider</text>
<rect x="890" y="310" width="260" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1020" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Control plane (planned)</text>
<text x="1020" y="358" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">cliox-dsp.ldas.jp, ldas-dsp</text>
<text x="1020" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">catalog, ODRL, contract</text>
<rect x="890" y="470" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="1020" y="498" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Data plane (live)</text>
<text x="1020" y="522" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">cliox-files.ldas.jp</text>
<text x="1020" y="546" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">behind Cloudflare Access</text>
<text x="1020" y="570" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">no negotiation</text>
<path d="M202 200 H328" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="208" y="220" text-anchor="start" font-size="11" font-weight="400" fill="#475569">browse, contract,</text>
<text x="208" y="234" text-anchor="start" font-size="11" font-weight="400" fill="#475569">view / download</text>
<path d="M202 340 H328" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="208" y="360" text-anchor="start" font-size="11" font-weight="400" fill="#475569">buy,</text>
<text x="208" y="374" text-anchor="start" font-size="11" font-weight="400" fill="#475569">start compute</text>
<path d="M802 160 H878" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="840" y="138" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">DSP, on every</text>
<text x="840" y="151" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">request</text>
<path d="M802 215 H840 V330 H888" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="846" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4f46e5">DSP</text>
<path d="M802 380 H888" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)" marker-start="url(#ais)"/>
<text x="836" y="400" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">once:</text>
<text x="836" y="414" text-anchor="middle" font-size="11" font-weight="400" fill="#4f46e5">DSP contract</text>
<path d="M608 360 H552" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="580" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">credential</text>
<text x="580" y="351" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">→ DDO</text>
<path d="M420 422 V498" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="430" y="452" text-anchor="start" font-size="11" font-weight="400" fill="#475569">DDO: URL + headers</text>
<text x="430" y="466" text-anchor="start" font-size="11" font-weight="400" fill="#475569">(encrypted)</text>
<path d="M888 540 H632" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="760" y="568" text-anchor="middle" font-size="11" font-weight="400" fill="#c2410c">file, per job</text>
<text x="760" y="582" text-anchor="middle" font-size="11" font-weight="400" fill="#c2410c">(Access service token)</text>
<path d="M328 580 H120 V382" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#ag)"/>
<text x="220" y="572" text-anchor="middle" font-size="12" font-weight="400" fill="#15803d">results only</text>
<path d="M60 158 V48 H1120 V118" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="140" y="40" text-anchor="start" font-size="12" font-weight="400" fill="#c2410c">(1) data straight from the provider: DSP data plane, short-lived pass after a contract on ds.ldas.jp (news-a: 20 min)</text>
<path d="M242 660 H300 V710 H1020 V602" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="2 4"/>
<text x="320" y="700" text-anchor="start" font-size="12" font-weight="400" fill="#475569">(2) Cloudflare Access email login: the provider's own staff only (admin, not a consumer path)</text>
<line x1="40" y1="770" x2="76" y2="770" stroke="#c2410c" stroke-width="5"/>
<text x="84" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">File data</text>
<line x1="187" y1="770" x2="223" y2="770" stroke="#15803d" stroke-width="5"/>
<text x="231" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">Results only</text>
<line x1="355" y1="770" x2="391" y2="770" stroke="#4f46e5" stroke-width="3"/>
<text x="399" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">DSP</text>
<line x1="460" y1="770" x2="496" y2="770" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="504" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">Request, metadata</text>
<line x1="663" y1="770" x2="699" y2="770" stroke="#475569" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="707" y="775" text-anchor="start" font-size="12" font-weight="400" fill="#1b2430">Access login (staff)</text>
<text x="40" y="816" text-anchor="start" font-size="12" font-weight="400" fill="#475569">ds.ldas.jp talks DSP to the providers on every request. cliox.ldas.jp does not: the Ocean node fetches from the data plane per job; DSP is used once, for the node's contract.</text>
</svg>