<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="ONCE: contract (DSP) / EACH COMPUTE JOB (Ocean, no DSP)">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="780" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="16" width="1160" height="270" rx="10" fill="#f1f5ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="2 0"/>
<text x="36" y="40" text-anchor="start" font-size="15" font-weight="600" fill="#334155">ONCE: contract (DSP)</text>
<rect x="20" y="304" width="1160" height="400" rx="10" fill="#f4faf5" stroke="#86efac" stroke-width="1.5" stroke-dasharray="2 0"/>
<text x="36" y="328" text-anchor="start" font-size="15" font-weight="600" fill="#334155">EACH COMPUTE JOB (Ocean, no DSP)</text>
<rect x="40" y="56" width="380" height="170" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
<text x="230" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">DSP providers</text>
<text x="230" y="110" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">speak DSP</text>
<text x="230" y="134" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">news-a, yanesen (ldas-dsp)</text>
<text x="230" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">Eclipse EDC</text>
<text x="230" y="182" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">Clio-X data provider (planned)</text>
<rect x="500" y="176" width="200" height="70" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
<text x="600" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">ds.ldas.jp</text>
<text x="600" y="224" text-anchor="middle" font-size="13" font-weight="400" fill="#1b2430">portal, not a connector</text>
<rect x="780" y="56" width="340" height="130" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
<text x="950" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Clio-X operator</text>
<text x="950" y="108" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">consumer side, for the node</text>
<text x="950" y="130" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">agrees: compute only,</text>
<text x="950" y="152" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">no redistribution</text>
<path d="M422 120 H778" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="600" y="100" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">DSP: catalog, ODRL policy,</text>
<text x="600" y="117" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">negotiation, transfer</text>
<path d="M498 211 H422" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="460" y="181" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">gathers</text>
<text x="460" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">catalogs</text>
<path d="M950 186 V294 H480 V348" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="715" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">long-lived credential, put into the DDO</text>
<rect x="40" y="346" width="200" height="84" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
<text x="140" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Publisher</text>
<text x="140" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">data holder</text>
<rect x="360" y="348" width="280" height="90" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
<text x="500" y="376" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Clio-X portal</text>
<text x="500" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">cliox.ldas.jp</text>
<text x="500" y="416" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">publish / buy</text>
<path d="M242 400 H358" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="300" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">registers</text>
<text x="300" y="387" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">dataset</text>
<rect x="40" y="530" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="170" y="562" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Data storage</text>
<text x="170" y="584" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">does not speak DSP</text>
<text x="170" y="606" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">cliox-files.ldas.jp</text>
<text x="170" y="628" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">guarded by Cloudflare Access</text>
<rect x="400" y="510" width="320" height="170" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
<text x="560" y="540" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Ocean node</text>
<text x="560" y="562" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">no DSP, no dataset</text>
<text x="560" y="584" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">1. fetch file by URL + headers</text>
<text x="560" y="606" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">2. run algorithm in isolated</text>
<text x="560" y="628" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">container, no network</text>
<text x="560" y="650" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">3. return results only</text>
<rect x="880" y="540" width="280" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
<text x="1020" y="576" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Consumer</text>
<text x="1020" y="598" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">gets results only,</text>
<text x="1020" y="620" text-anchor="middle" font-size="14" font-weight="400" fill="#1b2430">never the file</text>
<path d="M560 438 V508" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="572" y="468" text-anchor="start" font-size="12" font-weight="400" fill="#475569">DDO: URL + headers</text>
<text x="572" y="484" text-anchor="start" font-size="12" font-weight="400" fill="#475569">(encrypted)</text>
<path d="M300 595 H398" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ah)"/>
<text x="349" y="625" text-anchor="middle" font-size="12" font-weight="400" fill="#c2410c">file, per job</text>
<path d="M720 595 H878" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#ag)"/>
<text x="799" y="580" text-anchor="middle" font-size="13" font-weight="400" fill="#15803d">results only</text>
<path d="M1020 538 V400 H642" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#am)" stroke-dasharray="7 5"/>
<text x="1030" y="470" text-anchor="start" font-size="13" font-weight="400" fill="#475569">buys, starts a job</text>
<line x1="40" y1="730" x2="80" y2="730" stroke="#c2410c" stroke-width="5"/>
<text x="90" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">File data (storage to node only)</text>
<line x1="440" y1="730" x2="480" y2="730" stroke="#15803d" stroke-width="5"/>
<text x="490" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">Results only</text>
<line x1="600" y1="730" x2="640" y2="730" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="650" y="735" text-anchor="start" font-size="13" font-weight="400" fill="#1b2430">Metadata, credentials, requests (no file)</text>
<text x="40" y="760" text-anchor="start" font-size="12" font-weight="400" fill="#475569">Ocean only fetches by URL + headers. DSP is used once, for the contract. ds.ldas.jp and ldas-dsp implement DSP.</text>
</svg>