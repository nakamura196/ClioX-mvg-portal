# =============================================================================
# Clio-X backend for Sepolia: Ocean Node (catalogue + provider + C2D) and the
# Ocean subgraph, on one small VM. Everything runs in Docker; the host only
# needs Docker Engine with the compose plugin.
#
# Nothing listens on a public port. Services bind to 127.0.0.1 for debugging
# over SSH, and the public HTTPS endpoints come from a Cloudflare Tunnel
# (the `cloudflared` service). Its routing is in cloudflared/config.yml:
#     <node hostname>      -> http://ocean-node:8001
#     <subgraph hostname>  -> http://graph-node:8000
#     <chatbot hostname>   -> http://chatbot:8001   (profile chatbot, optional)
#
# Secrets live only in ./.env on the server (mode 600). See .env.example.
#
# Tested on: mdx VM, Ubuntu 24.04, 6 vCPU / 8.8 GiB RAM, Docker 29.
# Memory limits below add up to ~6.4 GiB, leaving room for the OS and one
# compute job (the C2D environment is capped at 2 CPU / 2 GiB per job).
# =============================================================================
name: cliox-node

services:
  ocean-node:
    image: oceanprotocol/ocean-node:4.2.0
    container_name: ocean-node
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - '127.0.0.1:8001:8001'
    environment:
      # Node identity and provider key. Reuse the same key when moving the node:
      # files of already-published assets are encrypted to this key.
      PRIVATE_KEY: '${PRIVATE_KEY:?PRIVATE_KEY is required}'

      # RPC choice (measured 2026-08): the indexer needs an endpoint that
      # accepts wide eth_getLogs ranges. publicnode rejects address-less
      # getLogs, Alchemy free allows 10 blocks, 1rpc.io 50 blocks. Tenderly's
      # public gateway returns 10,000 blocks in ~300 ms.
      # If a range is rejected the indexer still advances its head, so blocks
      # are skipped silently ("publish succeeded but never indexed").
      #
      # startBlock: just before our first Sepolia publish. Lower it only on a
      # fresh install (or after deleting the typesense-data and node-sqlite
      # volumes). Do not stop the node while it is catching up.
      RPCS: '{"11155111":{"rpc":"${SEPOLIA_INDEXER_RPC:-https://sepolia.gateway.tenderly.co}","chainId":11155111,"network":"sepolia","chunkSize":1000,"startBlock":11459550}}'
      INDEXER_NETWORKS: '[11155111]'
      INDEXER_INTERVAL: '10000'

      # Contract addresses: the official list bundled in the image
      # (@oceanprotocol/contracts). Do not override ADDRESS_FILE; the bundled
      # list also has the Sepolia AccessListFactory used for member lists.

      # DB_TYPE must be set explicitly; the default is elasticsearch.
      DB_TYPE: 'typesense'
      DB_URL: 'http://typesense:8108/?apiKey=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}'
      IPFS_GATEWAY: 'https://ipfs.io/'
      ARWEAVE_GATEWAY: 'https://arweave.net/'

      MAX_REQ_PER_MINUTE: 1000
      MAX_CONNECTIONS_PER_MINUTE: 1000

      # Compute-to-Data. The node starts job containers through the host's
      # Docker socket, which is root-equivalent on this VM. That is why this
      # node runs on its own VM, and why compute is limited to:
      #   - free jobs only (no "fees" section, so nobody can pay to run a job)
      #   - wallets listed in C2D_ALLOWED_ADDRESSES (JSON array, required)
      #   - no network access from inside a job
      # The description must contain "mdx-kashiwa": the portal resolves the
      # processing location (for the carbon estimate) from this text.
      DOCKER_COMPUTE_ENVIRONMENTS: '[{"socketPath":"/var/run/docker.sock","scanImages":false,"environments":[{"id":"mdx-kashiwa-cpu","description":"mdx (University of Tokyo, Kashiwa, Japan) mdx-kashiwa / CPU only","storageExpiry":604800,"minJobDuration":60,"maxJobDuration":900,"enableNetwork":false,"resources":[{"id":"cpu","total":2,"min":1,"max":2},{"id":"ram","total":2,"min":1,"max":2},{"id":"disk","total":20,"min":1,"max":10}],"free":{"maxJobDuration":600,"minJobDuration":10,"maxJobs":3,"access":{"addresses":${C2D_ALLOWED_ADDRESSES:?C2D_ALLOWED_ADDRESSES is required},"accessLists":[]},"resources":[{"id":"cpu","max":2},{"id":"ram","max":2},{"id":"disk","max":10}]}}]}]'

      HTTP_API_PORT: '8001'
      INTERFACES: '["HTTP"]'
      LOG_LEVEL: 'info'
      LOG_CONSOLE: 'true'

      # P2P stays on inside the container but is not published on the host.
      P2P_ENABLE_IPV4: 'true'
      P2P_ENABLE_IPV6: 'false'
      P2P_ipV4BindAddress: '0.0.0.0'
      P2P_ipV4BindTcpPort: '9000'
      P2P_ipV4BindWsPort: '9001'
      P2P_ENABLE_UPNP: 'false'
      P2P_ENABLE_CIRCUIT_RELAY_SERVER: 'false'
      P2P_ENABLE_CIRCUIT_RELAY_CLIENT: 'false'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - node-sqlite:/usr/src/app/databases
    networks: [cliox]
    depends_on: [typesense]
    # Wait for typesense before starting. The node creates its collections
    # (indexer, op_ddo_*) only when a lookup answers 404; if typesense is still
    # starting, the lookup fails some other way, creation is skipped, and the
    # indexer restarts from startBlock every ~90 s without ever saving its
    # position (seen 2026-09-26: search 500, portal "0 results").
    # The typesense image has no curl/wget, so the check runs here instead of
    # as a healthcheck there. Gives up after 2 minutes; Docker then restarts.
    # The exec line is the image's own CMD, unchanged.
    command:
      - sh
      - -c
      - |
        node -e 'const u=process.env.DB_URL.split("?")[0]+"health";(async()=>{for(let i=0;i<60;i++){try{if((await fetch(u)).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,2000))}console.error("typesense not ready after 120 s");process.exit(1)})()' || exit 1
        exec node --import ./dist/telemetry/otel.js --max-old-space-size=28784 --trace-warnings --experimental-specifier-resolution=node dist/index.js

  typesense:
    image: typesense/typesense:26.0
    container_name: ocean-typesense
    restart: unless-stopped
    mem_limit: 512m
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}'
    volumes:
      - typesense-data:/data
    networks: [cliox]

  # --- Subgraph ---------------------------------------------------------------
  # The portal queries ${subgraphUri}/subgraphs/name/oceanprotocol/ocean-subgraph.
  # Ocean Node does not serve this, so graph-node runs alongside it.
  graph-node:
    image: graphprotocol/graph-node:v0.45.0
    container_name: ocean-graph-node
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - '127.0.0.1:8000:8000' # GraphQL (the portal's subgraphUri)
      - '127.0.0.1:8020:8020' # admin JSON-RPC (subgraph deploys)
      - '127.0.0.1:8030:8030' # indexing status
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: '${GRAPH_POSTGRES_PASSWORD:?GRAPH_POSTGRES_PASSWORD is required}'
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      # The mappings make eth_call against past blocks, so this RPC must serve
      # archive state (publicnode does not). Public endpoints are slow for a
      # long sync; with the truncated startBlock the backlog is small.
      ethereum: 'sepolia:${SEPOLIA_SUBGRAPH_RPC:-https://sepolia.gateway.tenderly.co}'
      GRAPH_LOG: info
    depends_on: [ipfs, postgres]
    networks: [cliox]

  ipfs:
    image: ipfs/kubo:v0.43.1
    container_name: ocean-ipfs
    restart: unless-stopped
    mem_limit: 512m
    # Only used to hand the subgraph build to graph-node; no need to join the
    # public IPFS network from here.
    command: ['daemon', '--migrate=true', '--offline']
    volumes:
      - ipfs-data:/data/ipfs
    networks: [cliox]

  postgres:
    image: postgres:14
    container_name: ocean-graph-postgres
    restart: unless-stopped
    mem_limit: 768m
    command: ['postgres', '-cshared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: '${GRAPH_POSTGRES_PASSWORD:?GRAPH_POSTGRES_PASSWORD is required}'
      POSTGRES_DB: graph-node
      # graph-node requires the C locale.
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [cliox]

  # Builds and deploys the subgraph, then exits. Run on demand:
  #   docker compose --profile deploy-subgraph run --rm subgraph-deployer
  subgraph-deployer:
    build: ./subgraph
    profiles: [deploy-subgraph]
    depends_on: [graph-node, ipfs]
    networks: [cliox]

  # --- Chatbot for /usecases/chatbot (optional) --------------------------------
  # Started only when CHATBOT_API_KEY is set in .env (deploy.zsh adds the
  # profile). The portal's API routes call it at the chatbot hostname in
  # cloudflared/config.yml with header X-Chatbot-Key. Knowledge is held in
  # memory; nothing is written to disk except the model files.
  # Memory: the model (qwen2.5:1.5b, ~1 GB) needs ~1.5 GiB while answering.
  # CHATBOT_BACKEND=anthropic answers with Claude through the Anthropic API
  # instead (needs ANTHROPIC_API_KEY in .env); ollama then sits idle.
  chatbot:
    build: ./chatbot
    image: cliox-chatbot:local
    container_name: cliox-chatbot
    restart: unless-stopped
    profiles: [chatbot]
    command: ['python', '/app/server.py']
    volumes:
      - ./chatbot/server.py:/app/server.py:ro
      # today's question counts only (reset daily)
      - chatbot-data:/data
    environment:
      API_KEY: '${CHATBOT_API_KEY:-}'
      BACKEND: '${CHATBOT_BACKEND:-ollama}'
      OLLAMA_URL: http://ollama:11434
      # Empty means the backend's default (qwen2.5:1.5b / claude-opus-5-5).
      MODEL: '${CHATBOT_MODEL:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      # Optional limits (server.py). They need the portal's CHATBOT_REQUIRE_SIGNIN,
      # which sends the signed-in wallet address. Empty = off.
      ALLOWED_USERS: '${CHATBOT_ALLOWED_USERS:-}'
      DAILY_LIMIT_PER_USER: '${CHATBOT_DAILY_LIMIT_PER_USER:-}'
      DAILY_LIMIT_TOTAL: '${CHATBOT_DAILY_LIMIT_TOTAL:-}'
      USAGE_FILE: /data/usage.json
      PYTHONUNBUFFERED: '1'
    ports:
      - '127.0.0.1:8011:8001'
    mem_limit: 256m
    depends_on: [ollama]
    networks: [cliox]

  ollama:
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    container_name: cliox-ollama
    restart: unless-stopped
    profiles: [chatbot]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama-data:/root/.ollama
    # Leave CPU for compute jobs (the C2D environment uses up to 2 CPUs).
    cpus: 3
    mem_limit: 2560m
    networks: [cliox]

  # --- Public endpoints -------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cliox-cloudflared
    restart: unless-stopped
    mem_limit: 128m
    # Outbound-only: cloudflared dials out to Cloudflare, so the VM needs no
    # inbound port besides SSH.
    # mdx blocks outbound UDP, so QUIC (the default) never connects; use HTTP/2 over TCP.
    command:
      [
        'tunnel',
        '--no-autoupdate',
        '--protocol',
        'http2',
        '--config',
        '/etc/cloudflared/config.yml',
        'run'
      ]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    environment:
      TUNNEL_TOKEN: '${CLOUDFLARE_TUNNEL_TOKEN:-}'
    profiles: [tunnel]
    networks: [cliox]

volumes:
  typesense-data:
  node-sqlite:
  ipfs-data:
  postgres-data:
  ollama-data:
  chatbot-data:

networks:
  cliox:
    driver: bridge
